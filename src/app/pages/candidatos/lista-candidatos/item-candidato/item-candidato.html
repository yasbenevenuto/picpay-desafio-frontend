<div class="linha">
  <span class="celula numero">#{{ candidato().id }}</span>

  <a class="celula nome" [routerLink]="['/candidatos', candidato().id]">
    {{ candidato().nome }}
  </a>

  <span class="celula">{{ candidato().cargo }}</span>

  <span class="celula">{{ candidato().departamento || 'Não informado' }}</span>

  <span class="celula">
    <span [class]="ponto(candidato().status)">
      {{ rotulo(candidato().status) }}
    </span>
  </span>

  <span class="celula acoes">
    <button
      type="button"
      class="botao-acoes"
      [attr.aria-expanded]="menuAberto()"
      [attr.aria-label]="'Ações para ' + candidato().nome"
      (click)="alternarMenu($event)"
    >
      Ações
    </button>

    @if (menuAberto()) {
      <div class="menu">
        <button type="button" class="opcao" (click)="pedirExclusao()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
               stroke-linejoin="round" aria-hidden="true">
            <path d="M3 6h18" />
            <path d="M8 6V4h8v2" />
            <path d="M19 6l-1 14H6L5 6" />
            <path d="M10 11v6M14 11v6" />
          </svg>
          Excluir
        </button>

        <a class="opcao" [routerLink]="['/candidatos', candidato().id, 'editar']">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
               stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20h9" />
            <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
          </svg>
          Editar
        </a>
      </div>
    }
  </span>
</div>
